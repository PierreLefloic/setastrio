name: Auto-generate Thumbnails & Gallery

on:
  push:
    paths:
      - "images/full/**"
      - "thumbnail_generator.py"
      - "index.html"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow pushing commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pillow

      - name: Generate thumbnails and update gallery
        run: python thumbnail_generator.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate thumbnails and update gallery"
          file_pattern: |
            images/thumbs/*
            index.html
